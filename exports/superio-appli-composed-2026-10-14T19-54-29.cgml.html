  on_exec_clicked: (function(){
    try {
      // Handler : on_exec_clicked
// Widget  : #trt_exec_btn
// Signal  : clicked
function on_exec_clicked(payload) {
  const trtList     = Composer.widget('trt_data_list');
  const resultLabel = Composer.widget('trt_result_label');
  const detailLabel = Composer.widget('trt_result_detail');
  const historyBox  = Composer.widget('trt_history');

  if (!trtList || !resultLabel) {
    console.warn('[exec] widgets introuvables');
    return;
  }

  const rows = Array.prototype.slice.call(trtList.children);
  const values = [];
  for (let i = 0; i < rows.length; i++) {
    const v = parseFloat(rows[i].dataset.value);
    if (!isNaN(v)) values.push(v);
  }

  if (!values.length) {
    resultLabel.textContent = '—';
    if (detailLabel) detailLabel.textContent = 'Aucune donnée numérique.';
    return;
  }

  let op = 'sum';
  const opIds = ['op_sum', 'op_avg', 'op_min', 'op_max', 'op_count'];
  for (let i = 0; i < opIds.length; i++) {
    const wrap = Composer.widget(opIds[i]);
    if (!wrap) continue;
    const input = wrap.querySelector('input[type="radio"]');
    if (input && input.checked) {
      op = opIds[i].replace('op_', '');
      break;
    }
  }

  let result, label;
  if (op === 'sum') {
    result = values.reduce(function (a, b) { return a + b; }, 0);
    label = 'Σ';
  } else if (op === 'avg') {
    result = values.reduce(function (a, b) { return a + b; }, 0) / values.length;
    label = 'x̄';
  } else if (op === 'min') {
    result = Math.min.apply(null, values);
    label = 'min';
  } else if (op === 'max') {
    result = Math.max.apply(null, values);
    label = 'max';
  } else if (op === 'count') {
    result = values.length;
    label = 'count';
  }

  resultLabel.textContent = label + ' = ' + result;
  if (detailLabel) {
    detailLabel.textContent =
      'Sur ' + values.length + ' valeur(s) : ' + values.join(', ');
  }

  if (historyBox) {
    const entry = document.createElement('div');
    entry.style.cssText = 'padding:2px 6px;font-size:11px;color:#666';
    entry.textContent =
      '[' + new Date().toLocaleTimeString() + '] ' +
      label + ' = ' + result;
    historyBox.appendChild(entry);
    historyBox.scrollTop = historyBox.scrollHeight;
  }

  Composer.setStatus('▶ ' + label + ' = ' + result);
}
      return on_exec_clicked;
    } catch (e) {
      console.error("Handler on_exec_clicked :", e);
      return function(){};
    }
  })(),

(function(){
  var __views = [];
  var __winsByName = {};
  var __winsById = {};
  document.querySelectorAll(".cgml-window").forEach(function(el){
    __winsByName[el.dataset.gladeName] = el;
    __winsById[el.dataset.windowId] = el;
  });
  window.__lastClickedWindow = null;
  window.Composer = {
    current: function(){
      if (window.__lastClickedWindow) {
        var wid = window.__lastClickedWindow.dataset.windowId;
        if (wid && __winsById[wid]) return __winsById[wid];
      }
      var keys = Object.keys(__winsById);
      return keys.length ? __winsById[keys[0]] : null;
    },
    widget: function(gladeId){
      if (window.__lastClickedWindow) {
        var el = window.__lastClickedWindow.querySelector('[data-glade-id="' + gladeId + '"]');
        if (el) return el;
      }
      var keys = Object.keys(__winsById);
      for (var i = keys.length - 1; i >= 0; i--) {
        var w = __winsById[keys[i]];
        var el2 = w.querySelector('[data-glade-id="' + gladeId + '"]');
        if (el2) return el2;
      }
      return null;
    },
    widgetIn: function(gladeName, gladeId){
      var w = __winsByName[gladeName];
      if (!w) return null;
      return w.querySelector('[data-glade-id="' + gladeId + '"]');
    },
    widgetsIn: function(gladeName){
      var w = __winsByName[gladeName];
      if (!w) return {};
      var out = {};
      w.querySelectorAll("[data-glade-id]").forEach(function(el){
        out[el.dataset.gladeId] = el;
      });
      return out;
    },
    setStatus: function(t){ document.title = "CompoGlueML — " + t; },
    allWindows: function(){ return __winsById; }
  };
  document.querySelectorAll(".cgml-window").forEach(function(el){
    var view = window.__cgmlAttach(el, handlers, {
      onSignal: function(name, payload){
        console.log("[cgml]", name, payload && payload.widgetId);
      }
    });
    __views.push(view);
  });
  console.log("[cgml] " + __views.length + " fenêtre(s), " + Object.keys(handlers).length + " handler(s).");
})();
</script>
