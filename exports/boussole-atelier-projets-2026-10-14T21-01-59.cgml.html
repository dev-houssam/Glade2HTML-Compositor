<style>
/* === Styles du canevas exporté === */
html, body { margin: 0; padding: 0; min-height: 100vh; background: #2e3436;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #e0e0e0; }

.cgml-window.titlebar-hidden .gtk-window {
  border-top-left-radius: 0; border-top-right-radius: 0;
}

/* === Styles GTK Adwaita === */

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background: #2e3436;
      font-family: "Cantarell", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: #2e3436;
    }

    /* ============================================================
     * Fenêtre GTK
     * ============================================================ */
    .gtk-window {
      background: #fff;
      border: 1px solid #d4d0c8;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      display: inline-flex;
      flex-direction: column;
      max-width: 100%;
      overflow: hidden;
    }
    .gtk-titlebar {
      background: linear-gradient(#f8f7f6, #eae8e6);
      border-bottom: 1px solid #d4d0c8;
      padding: 8px 12px;
      text-align: center;
      font-weight: 600;
      flex: 0 0 auto;
    }
    .gtk-window-body {
      padding: 10px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .gtk-window-body::-webkit-scrollbar { width: 8px; }
    .gtk-window-body::-webkit-scrollbar-thumb {
      background: #c8c4bf; border-radius: 4px;
    }
    .gtk-window-body::-webkit-scrollbar-track { background: transparent; }

    /* ============================================================
     * Layout
     * ============================================================ */
    .gtk-box { display: flex; }
    .gtk-box.vertical   { flex-direction: column; }
    .gtk-box.horizontal { flex-direction: row; }

    /* === Enfants de GtkBox : comportement flex approprié === */
    /* Les boutons, combos, checks, radios ne se compressent pas */
    .gtk-box > .gtk-button,
    .gtk-box > .gtk-combo,
    .gtk-box > .gtk-check,
    .gtk-box > .gtk-radio,
    .gtk-box > .gtk-switch {
      flex-shrink: 0;
    }
    /* Les entrées ont une largeur minimale garantie mais peuvent s'étendre */
    .gtk-box > .gtk-entry,
    .gtk-box > .gtk-textview {
      min-width: 100px;
      flex-grow: 1;
      flex-shrink: 1;
    }

    /* ============================================================
     * Boutons
     * ============================================================ */
    .gtk-button {
      background: linear-gradient(#fdfdfc, #f0eeec);
      border: 1px solid #cdc7c1;
      border-radius: 5px;
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
      min-height: 30px;
      color: inherit;
      transition: background .1s;
    }
    .gtk-button:hover  { background: linear-gradient(#fff, #f6f5f4); }
    .gtk-button:active { background: #dcd9d6; }
    .gtk-button.disabled { opacity: .5; pointer-events: none; }

    /* ============================================================
     * Labels
     * ============================================================ */
    .gtk-label { display: inline-block; }

    /* ============================================================
     * Entrées / TextArea
     * ============================================================ */
    .gtk-entry, .gtk-textview {
      background: #fff;
      border: 1px solid #c0bdb8;
      border-radius: 5px;
      padding: 6px 10px;
      font: inherit;
      outline: none;
      min-height: 30px;
      color: #2e3436;
      width: 100%;
      box-sizing: border-box;
    }
    .gtk-entry:focus, .gtk-textview:focus {
      border-color: #3584e4;
      box-shadow: 0 0 0 2px rgba(53,132,228,.25);
    }
    .gtk-entry[readonly] { background: #fafafa; }

    /* ============================================================
     * Combos
     * ============================================================ */
    .gtk-combo {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, transparent 50%, #666 50%),
        linear-gradient(135deg, #666 50%, transparent 50%),
        linear-gradient(to right, #d4d0c8, #d4d0c8);
      background-position:
        calc(100% - 14px) 50%,
        calc(100% - 9px)  50%,
        calc(100% - 28px) 50%;
      background-size:
        5px 5px,
        5px 5px,
        1px 60%;
      background-repeat: no-repeat;
      border: 1px solid #c0bdb8;
      border-radius: 5px;
      padding: 6px 32px 6px 10px;
      font: inherit;
      color: #2e3436;
      cursor: pointer;
      outline: none;
      min-height: 30px;
      min-width: 100px;
      width: auto;
    }
    .gtk-combo:hover  { background-color: #f8f8f8; }
    .gtk-combo:focus  {
      border-color: #3584e4;
      box-shadow: 0 0 0 2px rgba(53,132,228,.25);
    }
    .gtk-combo option {
      background: #fff;
      color: #2e3436;
      padding: 4px;
    }

    /* ============================================================
     * Check / Radio / Switch — reset + style custom
     * ============================================================ */
    .gtk-check input[type="checkbox"],
    .gtk-radio input[type="radio"],
    .gtk-switch input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 1px solid #b8b4ae;
      background: #fff;
      cursor: pointer;
      flex: 0 0 auto;
      position: relative;
      transition: background .1s, border-color .1s;
      vertical-align: middle;
    }
    .gtk-check input[type="checkbox"],
    .gtk-switch input[type="checkbox"] { border-radius: 3px; }
    .gtk-radio input[type="radio"]     { border-radius: 50%; }

    .gtk-check input[type="checkbox"]:hover,
    .gtk-radio input[type="radio"]:hover,
    .gtk-switch input[type="checkbox"]:hover {
      border-color: #8a8a8a;
      background: #fafafa;
    }

    .gtk-check input[type="checkbox"]:checked,
    .gtk-switch input[type="checkbox"]:checked {
      background: #3584e4;
      border-color: #3584e4;
    }
    .gtk-check input[type="checkbox"]:checked::after,
    .gtk-switch input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .gtk-radio input[type="radio"]:checked {
      background: #3584e4;
      border-color: #3584e4;
    }
    .gtk-radio input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }

    .gtk-check, .gtk-radio, .gtk-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 3px 0;
      font-size: 13px;
      user-select: none;
    }
    .gtk-check span, .gtk-radio span { line-height: 1.2; }

    /* ============================================================
     * Frame
     * ============================================================ */
    .gtk-frame {
      border: 1px solid #cdc7c1;
      border-radius: 6px;
      padding: 12px 14px 14px;
      margin: 4px 0;
      min-width: 0;
    }
    .gtk-frame > legend {
      padding: 0 8px;
      font-weight: 600;
      font-size: 12px;
      color: #4a4a4a;
      margin-left: 4px;
    }

    /* ============================================================
     * Notebook
     * ============================================================ */
    .gtk-notebook-tabs {
      display: flex;
      border-bottom: 1px solid #cdc7c1;
      flex: 0 0 auto;
    }
    .gtk-notebook-tab {
      background: transparent;
      border: none;
      padding: 6px 14px;
      cursor: pointer;
      font: inherit;
      border-bottom: 2px solid transparent;
      color: #666;
    }
    .gtk-notebook-tab.active {
      border-color: #3584e4;
      color: #3584e4;
    }
    .gtk-notebook-panes { flex: 1 1 auto; overflow: auto; }
    .gtk-notebook-pane { display: none; padding: 10px; }
    .gtk-notebook-pane.active { display: block; }

    /* ============================================================
     * Séparateur
     * ============================================================ */
    .gtk-separator.horizontal { height: 1px; background: #d4d0c8; margin: 6px 0; }
    .gtk-separator.vertical   { width: 1px; background: #d4d0c8; margin: 0 6px; }

    /* ============================================================
     * Barre de progression
     * ============================================================ */
    .gtk-progress {
      background: #e0ddd8;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      min-width: 100px;
    }
    .gtk-progress-fill {
      height: 100%;
      background: #3584e4;
      transition: width .2s;
    }

    /* ============================================================
     * Expander
     * ============================================================ */
    .gtk-expander > summary {
      cursor: pointer;
      padding: 4px 0;
      font-weight: 600;
      font-size: 12px;
      color: #555;
      list-style: none;
    }
    .gtk-expander > summary::-webkit-details-marker { display: none; }
    .gtk-expander > summary::before {
      content: "▸";
      display: inline-block;
      width: 14px;
      transition: transform .15s;
    }
    .gtk-expander[open] > summary::before { transform: rotate(90deg); }

    /* ============================================================
     * ScrolledWindow
     * ============================================================ */
    .gtk-scrolled {
      overflow: auto;
      max-height: 400px;
    }
    .gtk-scrolled > .gtk-box { min-height: 0; }

    /* ============================================================
     * Grid
     * ============================================================ */
    .gtk-grid { display: grid; }

    /* ============================================================
     * Widgets non supportés
     * ============================================================ */
    .gtk-unsupported {
      border: 1px dashed #d75a4a;
      color: #d75a4a;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* ============================================================
     * Icônes (fallback)
     * ============================================================ */
    .gtk-icon { font-style: italic; color: #7a7a7a; }
  
</style>

<script>
/* ==================================================================
 * boussole_atelier_projets
 * Un atelier personnel pour capturer des idées, planifier des actions et suivre sa progression.
 * Version : 0.1.0
 * Auteur  : Moi
 * Exporté : 2026-10-14T21:01:59.052Z
 * 1 fenêtre(s), 5 handler(s)
 * ================================================================== */
window.__cgmlAttach = function (root, handlers, options) {
  options = options || {};
  var GTK_EVENT = { clicked:"click", toggled:"change", changed:"input",
    activate:"click", "state-set":"change", value_changed:"input" };
  function extractValue(el, evt) {
    var t = el.tagName.toLowerCase();
    if (t === "input" || t === "textarea" || t === "select") {
      if (el.type === "checkbox" || el.type === "radio") return el.checked;
      return el.value;
    }
    return evt === "click" ? true : undefined;
  }
  var widgets = {};
  root.querySelectorAll("[data-glade-id]").forEach(function (el) {
    widgets[el.dataset.gladeId] = el;
  });
  var bound = [];
  root.querySelectorAll("[data-glade-handler]").forEach(function (el) {
    var h = el.dataset.gladeHandler;
    var gtkSig = el.dataset.gladeSignal || "click";
    var domEvt = GTK_EVENT[gtkSig] || "click";
    var listener = function (ev) {
      var win = el.closest(".cgml-window");
      if (win) window.__lastClickedWindow = win;
      var payload = {
        widgetId: el.dataset.gladeId || "",
        gtkSignal: gtkSig,
        value: extractValue(el, domEvt),
        element: el,
        nativeEvent: ev
      };
      var fn = handlers[h];
      if (typeof fn === "function") {
        try { fn(payload); } catch (e) { console.error("[cgml] " + h + " :", e); }
      }
      if (options.onSignal) options.onSignal(h, payload);
    };
    el.addEventListener(domEvt, listener);
    bound.push({ el: el, evt: domEvt, fn: listener });
  });
  return {
    widgets: widgets,
    getWidget: function (id) { return widgets[id] || null; },
    destroy: function () { bound.forEach(function(b){ b.el.removeEventListener(b.evt, b.fn); }); }
  };
};

var handlers = {
  on_add_idea: (function(){
    try {
      function on_add_idea(payload) {
  var input = Composer.widget('idea_input');
  var list = Composer.widget('idea_list');
  if (!input || !list) return;
  var value = input.value.trim();
  if (!value) {
    Composer.setStatus('Écris une idée avant de l’ajouter');
    return;
  }
  var row = document.createElement('div');
  row.style.cssText = 'padding:10px 12px;background:#f3f6fb;border-left:4px solid #7188b8;border-radius:6px;font-size:13px;line-height:1.45;overflow-wrap:anywhere';
  var stamp = document.createElement('div');
  stamp.style.cssText = 'font-size:10px;color:#65748b;margin-bottom:3px';
  stamp.textContent = 'IDÉE · ' + new Date().toLocaleTimeString();
  var text = document.createElement('div');
  text.textContent = value;
  row.appendChild(stamp);
  row.appendChild(text);
  list.appendChild(row);
  input.value = '';
  input.focus();
  Composer.setStatus('Idée ajoutée au carnet');
}
      return on_add_idea;
    } catch (e) {
      console.error("Handler on_add_idea :", e);
      return function(){};
    }
  })(),
  on_clear_ideas: (function(){
    try {
      function on_clear_ideas(payload) {
  var list = Composer.widget('idea_list');
  if (!list) return;
  if (!list.children.length) {
    Composer.setStatus('Le carnet est déjà vide');
    return;
  }
  if (!confirm('Vider toutes les idées du carnet ?')) return;
  list.innerHTML = '';
  Composer.setStatus('Carnet d’idées vidé');
  var label = Composer.widget('ideas_stat');
  if (label) label.textContent = '0 idée';
}
      return on_clear_ideas;
    } catch (e) {
      console.error("Handler on_clear_ideas :", e);
      return function(){};
    }
  })(),
  on_add_task: (function(){
    try {
      function on_add_task(payload) {
  var input = Composer.widget('task_input');
  var list = Composer.widget('task_list');
  if (!input || !list) return;
  var value = input.value.trim();
  if (!value) {
    Composer.setStatus('Décris une action concrète avant de l’ajouter');
    return;
  }
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:9px;padding:9px 10px;background:#f5f7f5;border-radius:6px;font-size:13px';
  var check = document.createElement('input');
  check.type = 'checkbox';
  check.style.cssText = 'width:16px;height:16px;flex-shrink:0';
  var text = document.createElement('span');
  text.textContent = value;
  text.style.cssText = 'flex:1;overflow-wrap:anywhere';
  check.addEventListener('change', function() {
    text.style.textDecoration = check.checked ? 'line-through' : 'none';
    text.style.color = check.checked ? '#7b827d' : '#202720';
    var status = Composer.widget('status_label');
    if (status) status.textContent = check.checked ? 'Action terminée ✓' : 'Action rouverte';
  });
  row.appendChild(check);
  row.appendChild(text);
  list.appendChild(row);
  input.value = '';
  input.focus();
  Composer.setStatus('Action ajoutée au plan');
}
      return on_add_task;
    } catch (e) {
      console.error("Handler on_add_task :", e);
      return function(){};
    }
  })(),
  on_clear_tasks: (function(){
    try {
      function on_clear_tasks(payload) {
  var list = Composer.widget('task_list');
  if (!list) return;
  if (!list.children.length) {
    Composer.setStatus('Le plan est déjà vide');
    return;
  }
  if (!confirm('Supprimer toutes les actions du plan ?')) return;
  list.innerHTML = '';
  var done = Composer.widget('tasks_stat');
  var progress = Composer.widget('progress_bar');
  if (done) done.textContent = '0 / 0 action';
  if (progress) {
    progress.value = 0;
    progress.textContent = 'Avancement : 0 %';
  }
  Composer.setStatus('Plan d’action réinitialisé');
}
      return on_clear_tasks;
    } catch (e) {
      console.error("Handler on_clear_tasks :", e);
      return function(){};
    }
  })(),
  on_refresh_stats: (function(){
    try {
      function on_refresh_stats(payload) {
  var ideas = Composer.widget('idea_list');
  var tasks = Composer.widget('task_list');
  var ideaStat = Composer.widget('ideas_stat');
  var taskStat = Composer.widget('tasks_stat');
  var progress = Composer.widget('progress_bar');
  var message = Composer.widget('encouragement_label');
  if (!ideas || !tasks || !ideaStat || !taskStat || !progress) return;
  var total = tasks.children.length;
  var completed = 0;
  for (var i = 0; i < tasks.children.length; i++) {
    var cb = tasks.children[i].querySelector('input[type="checkbox"]');
    if (cb && cb.checked) completed++;
  }
  var ideaCount = ideas.children.length;
  var pct = total ? Math.round((completed / total) * 100) : 0;
  ideaStat.textContent = ideaCount + (ideaCount > 1 ? ' idées' : ' idée');
  taskStat.textContent = completed + ' / ' + total + ' action' + (total > 1 ? 's' : '');
  progress.value = pct / 100;
  progress.textContent = 'Avancement : ' + pct + ' %';
  if (message) {
    if (!total) message.textContent = 'Ajoute une première action pour lancer ton projet.';
    else if (pct === 100) message.textContent = 'Bravo ! Toutes les actions sont terminées.';
    else if (pct >= 60) message.textContent = 'Belle progression, continue sur cette lancée !';
    else if (pct > 0) message.textContent = 'Tu avances déjà. La prochaine petite étape compte aussi.';
    else message.textContent = 'Choisis une action simple et fais le premier pas.';
  }
  Composer.setStatus('Bilan actualisé · ' + pct + ' % terminé');
}
      return on_refresh_stats;
    } catch (e) {
      console.error("Handler on_refresh_stats :", e);
      return function(){};
    }
  })()
};

(function(){
  var __views = [];
  var __winsByName = {};
  var __winsById = {};
  document.querySelectorAll(".cgml-window").forEach(function(el){
    __winsByName[el.dataset.gladeName] = el;
    __winsById[el.dataset.windowId] = el;
  });
  window.__lastClickedWindow = null;
  window.Composer = {
    current: function(){
      if (window.__lastClickedWindow) {
        var wid = window.__lastClickedWindow.dataset.windowId;
        if (wid && __winsById[wid]) return __winsById[wid];
      }
      var keys = Object.keys(__winsById);
      return keys.length ? __winsById[keys[0]] : null;
    },
    widget: function(gladeId){
      if (window.__lastClickedWindow) {
        var el = window.__lastClickedWindow.querySelector('[data-glade-id="' + gladeId + '"]');
        if (el) return el;
      }
      var keys = Object.keys(__winsById);
      for (var i = keys.length - 1; i >= 0; i--) {
        var w = __winsById[keys[i]];
        var el2 = w.querySelector('[data-glade-id="' + gladeId + '"]');
        if (el2) return el2;
      }
      return null;
    },
    widgetIn: function(gladeName, gladeId){
      var w = __winsByName[gladeName];
      if (!w) return null;
      return w.querySelector('[data-glade-id="' + gladeId + '"]');
    },
    widgetsIn: function(gladeName){
      var w = __winsByName[gladeName];
      if (!w) return {};
      var out = {};
      w.querySelectorAll("[data-glade-id]").forEach(function(el){
        out[el.dataset.gladeId] = el;
      });
      return out;
    },
    setStatus: function(t){ document.title = "CompoGlueML — " + t; },
    allWindows: function(){ return __winsById; }
  };
  document.querySelectorAll(".cgml-window").forEach(function(el){
    var view = window.__cgmlAttach(el, handlers, {
      onSignal: function(name, payload){
        console.log("[cgml]", name, payload && payload.widgetId);
      }
    });
    __views.push(view);
  });
  console.log("[cgml] " + __views.length + " fenêtre(s), " + Object.keys(handlers).length + " handler(s).");
})();
</script>
